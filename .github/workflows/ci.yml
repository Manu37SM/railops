name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java unit, contract and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Real PostgreSQL, never H2: GiST exclusion, range types, partitions, advisory locks, deferred triggers.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: railops
          POSTGRES_PASSWORD: railops
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U railops" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # ItPostgres creates a throwaway database per test class on this server (role needs CREATEDB; the
      # container's superuser has it). Without this variable ItPostgres falls back to Testcontainers.
      RAILOPS_IT_PG: jdbc:postgresql://localhost:5432/postgres?user=railops&password=railops
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and verify (unit -> contract -> integration)
        run: mvn -B -ntp verify
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          retention-days: 14

  web:
    name: Angular unit tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: railops-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: railops-web/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  ml:
    # Pipeline tests + proof that the bundled model JSON and golden cases still agree (Java side runs in the java job).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r analytics/requirements.txt
      - run: python3 -m pytest analytics/tests -q
  contracts:
    name: Contract files are valid JSON Schema and fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Every schema and fixture parses; every schema declares draft 2020-12 and an $id
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys
          bad = []
          for p in pathlib.Path("contracts").rglob("*.json"):
              try:
                  d = json.loads(p.read_text())
              except Exception as e:
                  bad.append(f"{p}: {e}"); continue
              if p.name.endswith(".schema.json"):
                  if d.get("$schema") != "https://json-schema.org/draft/2020-12/schema" or "$id" not in d:
                      bad.append(f"{p}: missing $schema/$id")
          print("\n".join(bad) or "contracts OK"); sys.exit(1 if bad else 0)
          EOF

# End-to-end suites (scripts/*_e2e.py) need the whole stack, Kafka and Redis; they run via
# `scripts/test-all.sh --e2e` on an environment with docker compose (Phase 12), not on every PR.

  # ------------------------------------------------------------------------------------------------ Phase 12
  images:
    name: Image ${{ matrix.image }} (build, lint, scan)
    needs: [java, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [identity-service, reservation-service, payment-service, notification-service, api-gateway, web]
    permissions:
      contents: read
      id-token: write          # Workload Identity Federation to GCP (no long-lived JSON keys in GitHub)
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: deploy/docker/${{ matrix.image == 'web' && 'web' || 'service' }}.Dockerfile
          failure-threshold: warning
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.image == 'web' && 'web' || 'service' }}.Dockerfile
          build-args: ${{ matrix.image != 'web' && format('SERVICE={0}', matrix.image) || '' }}
          tags: railops/${{ matrix.image }}:${{ github.sha }}
          load: true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Vulnerability scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0, pinned by commit (tags can be moved)
        with:
          image-ref: railops/${{ matrix.image }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Image runs as non-root
        run: |
          user=$(docker image inspect railops/${{ matrix.image }}:${{ github.sha }} --format '{{.Config.User}}')
          echo "image user: $user"; [ -n "$user" ] && [ "$user" != "root" ] && [ "$user" != "0" ]
      - name: Push to Artifact Registry (main only, with SBOM + provenance)
        if: github.ref == 'refs/heads/main'
        run: echo "push via google-github-actions/auth (WIF) + docker/build-push-action push=true sbom=true provenance=mode=max"

  manifests:
    name: Kubernetes manifests (kustomize build + kubeconform)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Render and validate every overlay (core kinds strict, CRDs from the datree catalog)
        run: |
          for env in staging prod; do
            kustomize build deploy/k8s/overlays/$env > /tmp/$env.yaml
            kubeconform -strict -summary -kubernetes-version 1.33.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              /tmp/$env.yaml
          done
      - name: Prod pins images by digest
        run: |
          ! grep -E 'image: .*pkg.dev/.*:(IMAGE_TAG|latest|staging)$' /tmp/prod.yaml

  compose-e2e:
    name: Full stack in docker compose + deployment smoke test
    needs: [images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: scripts/gen-secrets.sh
      - name: Up (waits for every healthcheck and every migrator)
        run: docker compose -f deploy/compose/docker-compose.yml up -d --build --wait --wait-timeout 600
      - name: Load the test fixture (one train run) as the reservation schema owner
        run: |
          { echo "SET ROLE reservation_owner;"; cat scripts/seed.sql; } | \
            docker compose -f deploy/compose/docker-compose.yml exec -T postgres psql -v ON_ERROR_STOP=1 -U postgres -d railops
      - name: Smoke test from a container on both networks (payment's sim checkout is internal-only)
        run: |
          docker run -d --name smoke --network railops_edge -v "$PWD:/w" -w /w mcr.microsoft.com/playwright/python:v1.55.0-noble sleep 3600
          docker network connect railops_backend smoke
          docker exec smoke python3 -I scripts/deploy_smoke.py --web http://web:8080 --gateway http://api-gateway:8080 \
            --payment-internal http://payment-service:8080 --secrets deploy/secrets --bootstrap-admin
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color --tail 200
