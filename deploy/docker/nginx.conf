# Served by nginx-unprivileged (listens on 8080 as uid 101).
# UPSTREAM is the API gateway; set via envsubst-free static name (compose service / k8s Service "api-gateway").
upstream gateway {
    server api-gateway:8080;
    keepalive 32;
}

# X-Forwarded-For is APPENDED, not replaced: behind Google's load balancer $remote_addr is a Google Front End
# address, so replacing would make every user look like the same GFE IP (one shared rate-limit bucket, useless
# audit IPs). Appending is safe because the gateway (ClientIp) reads the chain right-to-left and stops at the first
# hop that is not a configured trusted proxy: anything a client wrote further left is ignored.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 64k;

    # ---- security headers on every response (CSP deferred from Phase 8)
    # No inline scripts, no third-party origins. 'unsafe-inline' for styles only: Angular injects component styles.
    # The payment page is a redirect to the PSP's own domain, not an iframe, so frame-src stays 'none'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # see note above: append + gateway trust walk
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_read_timeout 15s;
    }

    location = /.well-known/jwks.json {
        proxy_pass http://gateway;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed bundles: cache forever. index.html: never (so a deploy is picked up on next load).
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # A location with any add_header of its own inherits NONE of the server-level ones, so repeat them all here.
    location / {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
