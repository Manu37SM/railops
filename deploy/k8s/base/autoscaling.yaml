# Scale on CPU. Upper bounds are set by the database connection budget, not by the cluster: every reservation
# replica opens DB_POOL_SIZE (20) connections. 12 x 20 = 240 of Cloud SQL's 400 (docs/deployment.md §4).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: reservation-service}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: reservation-service}
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600     # Tatkal opens at 10:00/11:00: don't scale in between waves
      policies: [{type: Pods, value: 1, periodSeconds: 120}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api-gateway}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api-gateway}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: web}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: web}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
