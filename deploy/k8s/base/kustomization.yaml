apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: railops
labels:
  - pairs: {app.kubernetes.io/part-of: railops}
    includeSelectors: false
resources:
  - namespace.yaml
  - config.yaml
  - identity-service.yaml
  - reservation-service.yaml
  - payment-service.yaml
  - notification-service.yaml
  - api-gateway.yaml
  - web.yaml
  - autoscaling.yaml
  - network-policies.yaml
  - external-secrets.yaml
  - routing.yaml
patches:
  # container-native load balancing for the API entry as well
  - target: {kind: Service, name: api-gateway}
    patch: |-
      - op: add
        path: /metadata/annotations
        value: {cloud.google.com/neg: '{"ingress": true}'}
