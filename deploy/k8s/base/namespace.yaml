apiVersion: v1
kind: Namespace
metadata:
  name: railops
  labels:
    # Pod Security Admission: reject anything that isn't non-root, no privilege escalation, dropped caps, seccomp.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    istio-injection: enabled     # mTLS between pods (components/istio-mtls); harmless if Istio isn't installed
