    - {secretKey: contact-hmac-key, remoteRef: {key: railops-reservation-contact-hmac-key}}
    - {secretKey: client-secret, remoteRef: {key: railops-reservation-client-secret}}
    - {secretKey: redis-password, remoteRef: {key: railops-redis-auth}}
    - {secretKey: db-app-password, remoteRef: {key: railops-reservation-db-app-password}}
---
