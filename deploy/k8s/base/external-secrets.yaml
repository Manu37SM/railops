# Secrets are never in git or in manifests: External Secrets Operator syncs them from GCP Secret Manager into
# Kubernetes Secrets, which pods mount as FILES at /run/secrets (configtree). Rotation = new Secret Manager version;
# ESO refreshes, and a rollout restart picks it up (FieldCipher keeps old key ids readable, JWT keeps old public keys).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: {name: gcp-secret-manager}
spec:
  provider:
    gcpsm:
      projectID: PROJECT_ID
      auth:
        workloadIdentity:
          clusterLocation: REGION
          clusterName: railops
          serviceAccountRef: {name: external-secrets, namespace: external-secrets}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: identity-service}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: gcp-secret-manager}
  target: {name: identity-service, creationPolicy: Owner}
  data:
    - {secretKey: jwt-private-key-pem, remoteRef: {key: railops-identity-jwt-private-key}}
    - {secretKey: field-enc-key, remoteRef: {key: railops-identity-field-enc-key}}
    - {secretKey: phone-hmac-key, remoteRef: {key: railops-identity-phone-hmac-key}}
    - {secretKey: service-clients, remoteRef: {key: railops-identity-service-clients}}
    - {secretKey: db-app-password, remoteRef: {key: railops-identity-db-app-password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: reservation-service}
spec:
