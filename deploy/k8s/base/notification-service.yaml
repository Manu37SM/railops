apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  annotations:
    # Workload Identity: this KSA acts as the GSA below (Cloud SQL client, Secret Manager accessor for its own
    # secrets only). No JSON keys anywhere.
    iam.gke.io/gcp-service-account: notification-service@PROJECT_ID.iam.gserviceaccount.com
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels: {app.kubernetes.io/name: notification-service, app.kubernetes.io/part-of: railops}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: notification-service}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}   # never below desired capacity during a deploy
  template:
    metadata:
      labels: {app.kubernetes.io/name: notification-service, app.kubernetes.io/part-of: railops}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: notification-service
      automountServiceAccountToken: false
      # preStop sleep (endpoint removal propagates) + graceful shutdown (30 s) + margin
      terminationGracePeriodSeconds: 50
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: notification-service}}
      initContainers:
        # Cloud SQL Auth Proxy as a NATIVE sidecar (restartPolicy: Always, k8s >= 1.29): starts before the migrator
        # and the app, stops after them. TLS + IAM-authorised connection to the private-IP instance.
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2
          restartPolicy: Always
          args: ["--private-ip", "--structured-logs", "--port=5432", "--health-check", "--http-address=0.0.0.0",
                 "$(CLOUDSQL_INSTANCE)"]
          envFrom: [{configMapRef: {name: railops-platform}}]
          startupProbe: {httpGet: {path: /startup, port: 9090}, periodSeconds: 1, failureThreshold: 60}
          securityContext: {runAsNonRoot: true, runAsUser: 65532, allowPrivilegeEscalation: false,
                            readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
        # Schema migrations with the OWNER credentials, mounted only into this container. The app container below
        # never sees them (spring.flyway.enabled=false, DML-only role). Flyway's lock serialises concurrent pods.
        - name: migrate
          image: europe-docker.pkg.dev/railops-prod/railops/notification-service:IMAGE_TAG
          command: ["java", "-cp", "/opt/app/BOOT-INF/classes:/opt/app/BOOT-INF/lib/*", "in.railops.common.db.Migrate"]
          env:
            - {name: DB_URL, value: "jdbc:postgresql://127.0.0.1:5432/railops"}
            - {name: DB_MIGRATION_USER, value: notification_owner}
            - {name: DB_MIGRATION_PASSWORD_FILE, value: /run/owner/password}
            - {name: DB_SCHEMA, value: notification}
            - {name: APP_ROLE, value: notification_app}
          volumeMounts:
            - {name: owner-credentials, mountPath: /run/owner, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          securityContext: &restricted
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {memory: 512Mi}}
      containers:
        - name: app
          image: europe-docker.pkg.dev/railops-prod/railops/notification-service:IMAGE_TAG
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: railops-platform}
            - configMapRef: {name: notification-service}
          env:
            - name: SPRING_CONFIG_IMPORT
              value: optional:configtree:/run/secrets/
          volumeMounts:
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          # Startup can take ~30 s (Flyway validation is off, but Kafka/JPA init isn't instant): liveness only
          # starts judging after startup succeeds, so a slow start is never killed into a crash loop.
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:   # process health only: never dependencies, or a DB blip restarts every pod at once
            httpGet: {path: /actuator/health/liveness, port: 8080}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              sleep: {seconds: 10}   # let kube-proxy / NEGs stop routing here before Spring starts draining
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 768Mi}   # no CPU limit: throttling a JVM hurts latency more than sharing spare CPU
          securityContext: *restricted
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        - name: secrets
          secret:
            secretName: notification-service
            defaultMode: 0400
            items:
                  - key: client-secret
                    path: railops.security.client-secret
                  - key: db-app-password
                    path: spring.datasource.password
        - name: owner-credentials
          secret:
            secretName: notification-service-db-owner
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels: {app.kubernetes.io/name: notification-service}
spec:
  selector: {app.kubernetes.io/name: notification-service}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notification-service
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: notification-service}
