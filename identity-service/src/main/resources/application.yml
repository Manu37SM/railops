spring:
  application:
    name: identity-service
  config:
    # Secrets as files (docker/k8s secrets mounted at /run/secrets/<property.name>): unlike env vars they don't
    # show up in `docker inspect`, /proc/<pid>/environ or crash reports. Missing directory = no-op (local dev).
    # /run/secrets: docker/k8s secret mounts. /etc/secrets: Render "Secret Files" (deploy/render/README.md).
    import: "optional:configtree:/run/secrets/,optional:configtree:/etc/secrets/"
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/railops}
    username: ${DB_USER:identity_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 2000
      connection-init-sql: "SET lock_timeout = '3s'; SET statement_timeout = '10s'"
  jpa:
    open-in-view: false            # no lazy loading during view rendering: keeps DB connections request-scoped
    hibernate:
      ddl-auto: validate           # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate.default_schema: identity
      hibernate.jdbc.time_zone: UTC
  flyway:
    schemas: identity
    # Migrations run as the schema OWNER; the app connects as a DML-only role (Phase 12). Locally both are the
    # same user. ${appRole} in migrations receives the runtime grants.
    user: ${DB_MIGRATION_USER:${spring.datasource.username}}
    password: ${DB_MIGRATION_PASSWORD:${spring.datasource.password}}
    placeholders:
      appRole: ${spring.datasource.username}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      properties:
        max.block.ms: 2000
    listener:
      ack-mode: record
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  shutdown: graceful
  # The gateway sets X-Forwarded-For; only trust it because nothing else can reach this service (Phase 12).
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness and /readiness, also outside Kubernetes (compose)
      group:
        readiness:
          include: readinessState,db

railops:
  security:
    issuer: ${JWT_ISSUER:https://identity.railops.local}
  jwt:
    private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
    previous-public-keys-pem: ${JWT_PREVIOUS_PUBLIC_KEYS_PEM:}
  crypto:
    key-id: ${FIELD_KEY_ID:1}
    enc-key: ${FIELD_ENC_KEY:}
    hmac-key: ${PHONE_HMAC_KEY:}
  web:
    allowed-origins: ${ALLOWED_ORIGINS:https://railops.local}
  service-clients: ${SERVICE_CLIENTS:}
  raillens:
    # RailLens public API, for moving RailLens accounts into this login (Phase 4C).
    base-url: ${RAILOPS_RAILLENS_BASE_URL:http://localhost:8080/api/v1}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
